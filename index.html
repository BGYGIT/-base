<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дія — Реєстр Документів 2026</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.0/lucide.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        :root {
            --bg: #000;
            --surface: #111112;
            --card-grad: linear-gradient(145deg, #2c2c2e 0%, #121214 100%);
            --accent: #00c7be;
            --text-main: #ffffff;
            --text-dim: #8e8e93;
            --border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--text-main); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        nav {
            height: 85px; background: rgba(0,0,0,0.9); backdrop-filter: blur(20px);
            display: flex; align-items: center; justify-content: center;
            border-top: 1px solid var(--border); position: fixed; bottom: 0; width: 100%; z-index: 1000;
        }
        .nav-pill { display: flex; gap: 8px; background: var(--surface); padding: 5px; border-radius: 25px; border: 1px solid var(--border); }
        .nav-link { padding: 12px 22px; border-radius: 20px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--text-dim); transition: 0.3s; font-size: 14px; }
        .nav-link.active { background: var(--accent); color: #000; }

        #main-scroll { flex: 1; width: 100%; overflow-y: auto; padding-bottom: 120px; }
        .container { width: 100%; max-width: 550px; margin: 0 auto; padding: 20px; }
        h1 { font-size: 34px; font-weight: 900; margin-bottom: 25px; letter-spacing: -1px; }

        .doc-card-preview {
            background: var(--card-grad); border-radius: 28px; padding: 25px; margin-bottom: 15px;
            border: 1px solid var(--border); cursor: pointer; transition: 0.2s;
        }
        .preview-header { color: var(--accent); font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 8px; }
        .preview-name { font-size: 22px; font-weight: 800; text-transform: uppercase; }

        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #000; z-index: 2000; display: none; flex-direction: column;
            overflow-y: auto; padding: 20px;
        }
        .modal.active { display: flex; }
        
        .info-block { background: var(--surface); border-radius: 22px; padding: 20px; margin-top: 15px; border: 1px solid var(--border); }
        .info-row { border-bottom: 1px solid var(--border); padding: 12px 0; }
        .info-row:last-child { border: none; }
        .info-label { font-size: 9px; color: var(--text-dim); text-transform: uppercase; font-weight: 800; margin-bottom: 4px; }
        .info-val { font-size: 16px; font-weight: 700; color: #fff; }

        .field-input { width: 100%; background: #1c1c1e; border: 1px solid var(--border); border-radius: 14px; padding: 16px; color: #fff; font-size: 16px; margin-bottom: 10px; outline: none; }
        .btn-submit { width: 100%; padding: 20px; border-radius: 20px; border: none; font-weight: 900; font-size: 17px; background: #fff; color: #000; cursor: pointer; margin-top: 10px; }

        .screen { display: none; }
        .active-screen { display: block; }
    </style>
</head>
<body>

<div id="main-scroll">
    <div class="container">
        <section id="p-list" class="screen active-screen">
            <h1>Мої документи</h1>
            <div id="docs-list"></div>
        </section>

        <section id="p-add" class="screen">
            <h1>Додати документ</h1>
            <div style="background: var(--surface); padding: 25px; border-radius: 30px; border: 1px solid var(--border);">
                <select class="field-input" id="type-sel" onchange="renderEditor()" style="background: var(--accent); color:#000; font-weight:800;">
                    <option value="ID">ID-картка громадянина</option>
                    <option value="PASS">Закордонний паспорт</option>
                    <option value="STUD">Учнівський квиток</option>
                    <option value="BIRTH">Свідоцтво про народження</option>
                    <option value="MARR">Свідоцтво про шлюб</option>
                    <option value="ADDR">Витяг про місце проживання</option>
                </select>
                <div id="editor-fields"></div>
                <button class="btn-submit" onclick="saveDoc()" style="background: #fff;">Підтвердити видачу</button>
            </div>
        </section>
    </div>
</div>

<nav>
    <div class="nav-pill">
        <div id="n-list" class="nav-link active" onclick="go('list')"><i data-lucide="wallet"></i> Гаманець</div>
        <div id="n-add" class="nav-link" onclick="go('add')"><i data-lucide="plus-circle"></i> Оформити</div>
    </div>
</nav>

<div id="doc-modal" class="modal">
    <div style="display:flex; justify-content: space-between; align-items:center; margin-bottom:15px;">
        <div style="font-weight:900; color:var(--accent); font-size:11px;">ЕЛЕКТРОННИЙ ДОКУМЕНТ</div>
        <div onclick="closeModal()" style="cursor:pointer; font-weight:800; background:var(--surface); padding:8px 15px; border-radius:15px;">ЗАКРИТИ</div>
    </div>
    
    <div id="capture-area" style="background:#000;">
        <div id="modal-body"></div>
    </div>

    <button class="btn-submit" onclick="downloadAsImage()" style="background: var(--accent);"><i data-lucide="download"></i> Зберегти як PNG</button>
    <button class="btn-submit" onclick="confirmDelete()" style="background: #ff453a; color: #fff; margin-bottom: 40px;">Анулювати документ</button>
</div>

<script>
    let registry = JSON.parse(localStorage.getItem('diia_final_v1')) || [];
    let currentDocId = null;

    function go(id) {
        document.querySelectorAll('.screen, .nav-link').forEach(el => el.classList.remove('active-screen', 'active'));
        document.getElementById('p-' + id).classList.add('active-screen');
        document.getElementById('n-' + id).classList.add('active');
        if(id === 'add') renderEditor();
        if(id === 'list') renderRegistry();
        lucide.createIcons();
    }

    function renderEditor() {
        const type = document.getElementById('type-sel').value;
        const root = document.getElementById('editor-fields');
        let html = `
            <input class="field-input" id="f-last" placeholder="Прізвище">
            <input class="field-input" id="f-first" placeholder="Ім'я">
            <input class="field-input" id="f-mid" placeholder="По батькові">
            <select class="field-input" id="f-sex">
                <option value="Чоловіча / M">Стать: Чоловіча / M</option>
                <option value="Жіноча / F">Стать: Жіноча / F</option>
            </select>
            <input class="field-input" id="f-birth" placeholder="Дата народження">
        `;

        if(type === 'ID' || type === 'PASS') {
            html += `
                <input class="field-input" id="f-unzr" placeholder="Запис № (УНЗР)">
                <input class="field-input" id="f-num" placeholder="Номер документа">
                <input class="field-input" id="f-org" placeholder="Орган видачі (Код)">
                <input class="field-input" id="f-issued" placeholder="Дата видачі">
                <input class="field-input" id="f-expire" placeholder="Дійсний до">
            `;
        } else if(type === 'STUD') {
            html += `
                <input class="field-input" id="f-school" placeholder="Назва навчального закладу">
                <input class="field-input" id="f-class" placeholder="Клас">
                <input class="field-input" id="f-num" placeholder="Номер квитка">
            `;
        } else if(type === 'BIRTH') {
            html += `
                <input class="field-input" id="f-num" placeholder="Серія та номер">
                <input class="field-input" id="f-place" placeholder="Місце народження">
                <input class="field-input" id="f-father" placeholder="ПІБ батька">
                <input class="field-input" id="f-mother" placeholder="ПІБ матері">
            `;
        } else if(type === 'MARR') {
            html += `
                <input class="field-input" id="f-partner" placeholder="ПІБ другого з подружжя">
                <input class="field-input" id="f-safter" placeholder="Прізвище після реєстрації">
                <input class="field-input" id="f-num" placeholder="Серія та номер свідоцтва">
                <input class="field-input" id="f-issued" placeholder="Дата реєстрації шлюбу">
            `;
        } else if(type === 'ADDR') {
            html += `
                <input class="field-input" id="f-address" placeholder="Вулиця, будинок, квартира">
                <input class="field-input" id="f-city" placeholder="Населений пункт">
                <input class="field-input" id="f-dist" placeholder="Район та Область">
            `;
        }
        root.innerHTML = html;
    }

    function saveDoc() {
        const data = {
            id: Date.now(),
            type: document.getElementById('type-sel').value,
            l: document.getElementById('f-last').value,
            f: document.getElementById('f-first').value,
            m: document.getElementById('f-mid').value,
            s: document.getElementById('f-sex').value,
            b: document.getElementById('f-birth').value,
            unzr: document.getElementById('f-unzr')?.value || '',
            num: document.getElementById('f-num')?.value || '',
            org: document.getElementById('f-org')?.value || '',
            iss: document.getElementById('f-issued')?.value || '',
            exp: document.getElementById('f-expire')?.value || '',
            school: document.getElementById('f-school')?.value || '',
            cls: document.getElementById('f-class')?.value || '',
            partner: document.getElementById('f-partner')?.value || '',
            safter: document.getElementById('f-safter')?.value || '',
            addr: document.getElementById('f-address')?.value || '',
            city: document.getElementById('f-city')?.value || '',
            dist: document.getElementById('f-dist')?.value || ''
        };
        registry.push(data);
        localStorage.setItem('diia_final_v1', JSON.stringify(registry));
        go('list');
    }

    function renderRegistry() {
        const root = document.getElementById('docs-list');
        const labels = {ID:'ID-картка', PASS:'Закордонний', STUD:'Учнівський', BIRTH:'Свідоцтво', MARR:'Шлюб', ADDR:'Місце проживання'};
        root.innerHTML = registry.map(d => `
            <div class="doc-card-preview" onclick="openDoc(${d.id})">
                <div class="preview-header">${labels[d.type]}</div>
                <div class="preview-name">${d.l} ${d.f}</div>
            </div>
        `).join('') || '<div style="opacity:0.2; text-align:center; margin-top:50px;">У вашому гаманці поки порожньо</div>';
    }

    function openDoc(id) {
        currentDocId = id;
        const d = registry.find(x => x.id === id);
        const titles = {ID:'ID-картка громадянина', PASS:'Закордонний паспорт', STUD:'Учнівський квиток', BIRTH:'Свідоцтво про народження', MARR:'Свідоцтво про шлюб', ADDR:'Витяг про проживання'};
        const body = document.getElementById('modal-body');
        
        body.innerHTML = `
            <div style="background: var(--card-grad); border-radius: 30px; padding: 30px; border: 1px solid var(--border);">
                <div class="preview-header" style="font-size:12px;">${titles[d.type]}</div>
                <div style="font-size: 28px; font-weight: 900; line-height: 1.1; margin-bottom: 20px; text-transform:uppercase;">${d.l}<br>${d.f}</div>
                
                <div class="info-block">
                    <div class="info-row"><span class="info-label">ПІБ</span><div class="info-val">${d.l} ${d.f} ${d.m}</div></div>
                    <div class="info-row"><span class="info-label">Стать / Sex</span><div class="info-val">${d.s}</div></div>
                    <div class="info-row"><span class="info-label">Дата народження</span><div class="info-val">${d.b}</div></div>
                    ${d.unzr ? `<div class="info-row"><span class="info-label">Запис № (УНЗР)</span><div class="info-val" style="color:var(--accent);">${d.unzr}</div></div>` : ''}
                    ${d.num ? `<div class="info-row"><span class="info-label">Номер документа</span><div class="info-val">${d.num}</div></div>` : ''}
                    ${d.partner ? `<div class="info-row"><span class="info-label">Другий з подружжя</span><div class="info-val">${d.partner}</div></div>` : ''}
                    ${d.safter ? `<div class="info-row"><span class="info-label">Прізвище після шлюбу</span><div class="info-val">${d.safter}</div></div>` : ''}
                    ${d.school ? `<div class="info-row"><span class="info-label">Школа</span><div class="info-val">${d.school}, ${d.cls} клас</div></div>` : ''}
                </div>

                <div class="info-block">
                    ${d.org ? `<div class="info-row"><span class="info-label">Орган видачі</span><div class="info-val">${d.org}</div></div>` : ''}
                    ${d.iss ? `<div class="info-row"><span class="info-label">Дата видачі</span><div class="info-val">${d.iss}</div></div>` : ''}
                    ${d.exp ? `<div class="info-row"><span class="info-label">Дійсний до</span><div class="info-val">${d.exp}</div></div>` : ''}
                    ${d.addr ? `<div class="info-row"><span class="info-label">Адреса</span><div class="info-val">${d.addr}, ${d.city}</div></div>` : ''}
                </div>
            </div>
        `;
        document.getElementById('doc-modal').classList.add('active');
        lucide.createIcons();
    }

    function closeModal() { document.getElementById('doc-modal').classList.remove('active'); }

    async function downloadAsImage() {
        const area = document.getElementById('capture-area');
        const canvas = await html2canvas(area, { backgroundColor: '#000', scale: 3 });
        const link = document.createElement('a');
        link.download = `diia_export_${Date.now()}.png`;
        link.href = canvas.toDataURL();
        link.click();
    }

    function confirmDelete() {
        if(confirm('Ви впевнені, що хочете видалити цей документ?')) {
            registry = registry.filter(x => x.id !== currentDocId);
            localStorage.setItem('diia_final_v1', JSON.stringify(registry));
            closeModal();
            renderRegistry();
        }
    }

    window.onload = () => { renderRegistry(); lucide.createIcons(); };
</script>
</body>
</html>
